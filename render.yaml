services:
- type: web
  name: salespro-api
  env: node
  region: oregon
  plan: free
  buildCommand: cd server && npm install
  startCommand: cd server && npm start
  envVars:
  - key: NODE_ENV
    value: production
  - key: DATABASE_URL
    fromDatabase:
      name: salespro-db
      property: connectionString
  - key: JWT_SECRET
    generateValue: true
  - key: JWT_REFRESH_SECRET
    generateValue: true
  - key: JWT_EXPIRE
    value: 24h
  - key: JWT_REFRESH_EXPIRE
    value: 7d
  - key: CLIENT_URL
    fromService:
      name: salespro-client
      type: web
      property: url
  - key: PAYSTACK_SECRET_KEY
    sync: false
  - key: PAYSTACK_PUBLIC_KEY
    sync: false
  - key: FLUTTERWAVE_SECRET_KEY
    sync: false
  - key: FLUTTERWAVE_SECRET_HASH
    sync: false
  - key: LOG_LEVEL
    value: debug

- type: web
  name: salespro-client
  env: static
  region: oregon
  plan: free
  buildCommand: cd client && npm install && npm run build
  staticPublishPath: ./client/build
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  envVars:
  - key: REACT_APP_API_URL
    fromService:
      name: salespro-api
      type: web
      property: url
  - key: REACT_APP_PAYSTACK_KEY
    sync: false
  - key: REACT_APP_FLUTTERWAVE_KEY
    sync: false

databases:
- name: salespro-db
  plan: free
  region: oregon
